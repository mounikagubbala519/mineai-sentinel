version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineai-sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=True
      - PROJECT_NAME=MineAI Sentinel
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mineai-sentinel-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: always
